<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Hacking & Cloud Security Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen" class="start-container">
        <h1>Ethical Hacking & Cloud Security Test</h1>
        <p>Total Questions: <b id="total-questions">100</b></p>
        <p>Total Marks: <b id="total-marks">200</b></p>
        <p>Marks per Question: <b>2</b></p>
        <p>Time: <b>3 Hours</b></p>
        <input type="text" id="student-name" placeholder="Enter your name">
        <input type="text" id="roll-number" placeholder="Enter roll number">
        <button id="start-button" onclick="startTest()">Start Test</button>
        <p id="start-error"></p>
    </div>

    <div id="test-screen" class="main-container" style="display:none;">
        <div class="test-container">
            <h1>Assessment Test</h1>
            <div class="timer" id="timer">Time Remaining: 03:00:00</div>
            <p id="question-number"></p>
            <h2 id="question"></h2>
            <div class="options" id="options"></div>

            <div class="navigation">
                <button id="previous-button" onclick="previousQuestion()">Previous</button>
                <button id="next-button" onclick="nextQuestion()">Next</button>
            </div>

            <button id="submit-button" class="submit-button" onclick="submitTest()">Submit Test</button>
            <p id="submit-error"></p>
        </div>

        <div class="palette-container">
            <h3>Questions</h3>
            <div id="question-palette"></div>
            <p class="legend">Blue: Current | Green: Answered</p>
        </div>
    </div>

    <div id="result-screen" class="result-container" style="display:none;">
        <h1>Test Result</h1>
        <p>Name: <b id="result-name"></b></p>
        <p>Roll Number: <b id="result-roll"></b></p>
        <p id="answered"></p>
        <p id="skipped"></p>
        <p id="correct"></p>
        <p id="wrong"></p>
        <h2 id="score"></h2>
        <h2 id="percentage"></h2>
        <button onclick="location.reload()">Take Test Again</button>
    </div>
<script src="./script.js" defer></script>
</body>
</html>
