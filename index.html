<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen" class="start-container">
        <h1>Aptitude Test</h1>
        <p>Total Questions: <b id="total-questions">0</b></p>
        <p>Total Marks: <b id="total-marks">0</b></p>
        <p>Marks per Question: <b>2</b></p>
        <p>Time: <b>1 Hour</b></p>
        <input type="text" id="student-name" placeholder="Enter your name">
        <input type="text" id="roll-number" placeholder="Enter roll number">
        <button id="start-button" onclick="startTest()">Start Test</button>
        <p id="start-error"></p>
    </div>

    <div id="test-screen" class="main-container" style="display: none;">
        <div class="test-container">
            <h1>Aptitude Test</h1>
            <div class="timer" id="timer">Time Remaining: 60:00</div>
            <p id="question-number">Question 1 of 0</p>
            <h2 id="question"></h2>
            <div class="options" id="options"></div>
            <div class="navigation">
                <button id="previous-button" onclick="previousQuestion()">Previous</button>
                <button id="next-button" onclick="nextQuestion()">Next</button>
            </div>
            <button id="submit-button" class="submit-button" onclick="submitTest()">Submit Test</button>
            <p id="submit-error"></p>
        </div>
        <div class="palette-container">
            <h3>Questions</h3>
            <div id="question-palette"></div>
        </div>
    </div>

    <div id="result-screen" class="result-container" style="display: none;">
        <h1>Test Result</h1>
        <p>Name: <b id="result-name"></b></p>
        <p>Roll Number: <b id="result-roll"></b></p>
        <p id="answered"></p>
        <p id="skipped"></p>
        <p id="correct"></p>
        <p id="wrong"></p>
        <h2 id="score"></h2>
        <h2 id="percentage"></h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
