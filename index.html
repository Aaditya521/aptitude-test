<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aptitude Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= START SCREEN ================= -->

    <div id="start-screen" class="start-container">

        <h1>Aptitude Test</h1>

        <p>Total Questions: <b>50</b></p>
        <p>Total Marks: <b>100</b></p>
        <p>Marks per Question: <b>2</b></p>
        <p>Time: <b>1 Hour</b></p>

        <input
            type="text"
            id="student-name"
            placeholder="Enter your name"
        >

        <input
            type="text"
            id="roll-number"
            placeholder="Enter roll number"
        >

        <button id="start-button" onclick="startTest()">
            Start Test
        </button>

        <p id="start-error"></p>

    </div>


    <!-- ================= TEST SCREEN ================= -->

    <div id="test-screen" class="main-container" style="display: none;">

        <!-- TEST SECTION -->

        <div class="test-container">

            <h1>Aptitude Test</h1>

            <!-- TIMER -->

            <div class="timer" id="timer">
                Time Remaining: 60:00
            </div>

            <!-- QUESTION NUMBER -->

            <p id="question-number">
                Question 1 of 50
            </p>

            <!-- QUESTION -->

            <h2 id="question"></h2>

            <!-- OPTIONS -->

            <div class="options" id="options"></div>


            <!-- NAVIGATION -->

            <div class="navigation">

                <button
                    id="previous-button"
                    onclick="previousQuestion()">
                    Previous
                </button>

                <button
                    id="next-button"
                    onclick="nextQuestion()">
                    Next
                </button>

            </div>


            <!-- SUBMIT -->

            <button
                id="submit-button"
                class="submit-button"
                onclick="submitTest()">

                Submit Test

            </button>

            <p id="submit-error"></p>

        </div>


        <!-- ================= QUESTION PALETTE ================= -->

        <div class="palette-container">

            <h3>Questions</h3>

            <div id="question-palette"></div>

        </div>

    </div>


    <!-- ================= RESULT SCREEN ================= -->

    <div
        id="result-screen"
        class="result-container"
        style="display: none;">

        <h1>Test Result</h1>


        <!-- STUDENT DETAILS -->

        <p>
            Name:
            <b id="result-name"></b>
        </p>

        <p>
            Roll Number:
            <b id="result-roll"></b>
        </p>


        <!-- RESULT DETAILS -->

        <p id="answered"></p>

        <p id="skipped"></p>

        <p id="correct"></p>

        <p id="wrong"></p>


        <!-- SCORE -->

        <h2 id="score"></h2>

        <h2 id="percentage"></h2>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
